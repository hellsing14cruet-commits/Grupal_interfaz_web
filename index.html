<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingeniería Económica - Simulador Financiero Avanzado | Grupo 10</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #060d0a 0%, #0d1f16 100%);
            --bg-card: rgba(18, 38, 28, 0.45);
            --bg-input: #0a1410;
            --gold-glow: #f3e5ab;
            --gold-solid: #d4af37;
            --green-money: #2ecc71;
            --text-main: #f4f7f6;
            --text-muted: #8fa89b;
            --border-gold: rgba(214, 175, 55, 0.25);
            --neon-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- PANTALLA 1: BIENVENIDA (CINEMÁTICA Y ELEGANTE) --- */
        #pantalla-bienvenida {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
            width: 100%;
            max-width: 800px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .emblema-financiero {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(46, 204, 113, 0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            margin-bottom: 30px;
            border: 2px solid var(--border-gold);
            box-shadow: 0 0 30px rgba(214, 175, 55, 0.15);
            animation: flotar 4s infinite ease-in-out;
        }

        .titulo-bienvenida {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 0 0 15px 0;
            text-transform: uppercase;
        }

        .titulo-bienvenida span {
            color: var(--gold-solid);
            background: linear-gradient(to right, #ffe699, var(--gold-solid));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo-bienvenida {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-ingresar {
            background: linear-gradient(135deg, var(--gold-solid) 0%, #b89326 100%);
            color: #050a07;
            font-size: 16px;
            font-weight: 800;
            padding: 18px 45px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(214, 175, 55, 0.25);
            transition: all 0.3s ease;
        }

        .btn-ingresar:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.4);
            background: linear-gradient(135deg, var(--green-money) 0%, #27ae60 100%);
            color: white;
        }

        /* --- PANTALLA 2: DASHBOARD INTEGRAL --- */
        #dashboard-principal {
            display: none;
            opacity: 0;
            width: 100%;
            max-width: 1200px;
            padding: 30px 20px;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }

        .navbar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 20px;
            margin-bottom: 35px;
        }

        .navbar-brand h2 {
            margin: 0;
            font-size: 26px;
            color: var(--gold-solid);
            font-weight: 800;
        }

        .navbar-brand p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .emoticono-status {
            font-size: 32px;
            background: var(--bg-card);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-gold);
        }

        /* Distribución de Paneles */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .workspace-grid { grid-template-columns: 1fr; }
        }

        .panel-modulo {
            background-color: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .panel-modulo h3 {
            margin-top: 0;
            color: var(--gold-solid);
            font-size: 20px;
            letter-spacing: -0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .glosario-lista {
            padding-left: 20px;
            color: var(--text-muted);
        }

        .glosario-lista li {
            margin-bottom: 12px;
        }

        .glosario-lista strong {
            color: var(--text-main);
        }

        .visor-formula {
            background: var(--bg-input);
            border: 1px solid rgba(46, 204, 113, 0.3);
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            color: var(--green-money);
            font-weight: bold;
            margin: 20px 0;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }

        /* Inputs de la Consola */
        .control-grupo {
            margin-bottom: 18px;
        }

        .control-grupo label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-grupo input, .control-grupo select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            background-color: var(--bg-input);
            color: white;
            font-size: 15px;
            font-weight: 600;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .control-grupo input:focus {
            outline: none;
            border-color: var(--green-money);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
        }

        /* Display de Resultados Moderno */
        .terminal-resultados {
            background: #050a07;
            border: 1px solid var(--gold-solid);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .fila-data {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .fila-data:last-child { border: none; }

        .valor-computado {
            font-size: 18px;
            font-weight: 700;
            color: var(--green-money);
        }

        .valor-computado.total-destacado {
            font-size: 22px;
            color: var(--gold-solid);
            text-shadow: 0 0 10px rgba(214, 175, 55, 0.2);
        }

        /* Sección de Casos Interactivos */
        .seccion-full-width {
            grid-column: 1 / -1;
        }

        .contenedor-casos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .tarjeta-caso-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-gold);
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .tarjeta-caso-btn:hover {
            border-color: var(--green-money);
            transform: translateY(-2px);
            background: rgba(46, 204, 113, 0.05);
        }

        .tarjeta-caso-btn h4 {
            margin: 0 0 8px 0;
            color: var(--gold-solid);
            font-size: 16px;
        }

        .tarjeta-caso-btn p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .banner-explicacion {
            margin-top: 20px;
            padding: 20px;
            background: rgba(214, 175, 55, 0.04);
            border-left: 4px solid var(--gold-solid);
            border-radius: 4px;
            display: none;
        }

        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

        <h1 class="titulo-bienvenida">Plataforma Avanzada de <span>Ingeniería Económica</span></h1>
        <p class="subtitulo-bienvenida">

        @keyframes flotar {
