<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingeniería Económica Premium - Grupo 10</title>
    <style>
        /* Variables de paleta de colores de alta gama: Verdes monetarios, oros y oscuros elegantes */
        :root {
            --bg-deep: #0b1511;
            --bg-card: #12241c;
            --bg-input: #1a3227;
            --gold-primary: #d4af37;
            --gold-hover: #f3e5ab;
            --green-money: #2ecc71;
            --text-light: #f4f7f6;
            --text-muted: #a3b899;
            --borde-elegante: rgba(212, 175, 55, 0.3);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- PORTADA 1: BIENVENIDA (ESTILO R RICO / PATO DINERO) --- */
        #portada-bienvenida {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background: radial-gradient(circle at center, #163526 0%, var(--bg-deep) 70%);
            padding: 20px;
            box-sizing: border-box;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .contenedor-avatar {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, var(--gold-primary), var(--green-money));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.4);
            margin-bottom: 25px;
            position: relative;
            border: 4px solid var(--gold-primary);
        }

        /* Iconografía creativa inspirada en el Pato de la Fortuna y Monedas */
        .contenedor-avatar::before {
            content: "🦆💰";
            font-size: 80px;
        }

        .lluvia-simbolos {
            position: absolute;
            font-size: 24px;
            color: var(--gold-primary);
            animation: flotar 3s infinite ease-in-out;
        }

        h1.titulo-portada {
            font-size: 42px;
            font-weight: 900;
            color: var(--text-light);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1.titulo-portada span {
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(214, 175, 55, 0.5);
        }

        .subtitulo-portada {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 40px;
            font-style: italic;
        }

        /* Botón de transición premium */
        .btn-siguiente {
            background: linear-gradient(135deg, var(--gold-primary) 0%, #b89326 100%);
            color: #000;
            font-size: 18px;
            font-weight: 800;
            padding: 16px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(214, 175, 55, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-siguiente:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(46, 204, 113, 0.6);
            background: linear-gradient(135deg, var(--green-money) 0%, #27ae60 100%);
            color: var(--text-light);
        }

        /* --- PORTADA 2: CONTENIDO Y CALCULADORA (ESTILO MONOPOLY MILLONARIO) --- */
        #panel-principal {
            display: none; /* Se activa mediante JS */
            opacity: 0;
            transition: opacity 0.6s ease;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--borde-elegante);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .header-info h2 {
            margin: 0;
            font-size: 28px;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-info p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-weight: 600;
        }

        .avatar-monopoly {
            font-size: 45px;
            background: var(--bg-card);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--gold-primary);
            box-shadow: inset 0 0 10px rgba(214, 175, 55, 0.2);
        }

        /* Cuadrícula de herramientas */
        .grid-dashboard {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 900px) {
            .grid-dashboard { grid-template-columns: 1fr; }
        }

        .card-financiera {
            background-color: var(--bg-card);
            border: 1px solid var(--borde-elegante);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .card-financiera::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--gold-primary), var(--green-money));
        }

        .card-financiera h3 {
            margin-top: 0;
            color: var(--gold-primary);
            font-size: 22px;
            border-bottom: 1px dashed var(--borde-elegante);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .formula-premium {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--green-money);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            color: var(--green-money);
            font-weight: bold;
            margin: 25px 0;
            box-shadow: inset 0 0 15px rgba(46, 204, 113, 0.1);
        }

        /* Inputs Estilizados */
        .grupo-input {
            margin-bottom: 20px;
        }

        .grupo-input label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .grupo-input input, .grupo-input select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--borde-elegante);
            border-radius: 8px;
            background-color: var(--bg-input);
            color: var(--text-light);
            font-size: 16px;
            font-weight: 600;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .grupo-input input:focus {
            outline: none;
            border-color: var(--green-money);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        /* Pantallas de Resultados */
        .pantalla-resultados {
            background: linear-gradient(180deg, #090f0c 0%, #13241b 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .resultado-linea {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .resultado-linea:last-child { border: none; }

        .resultado-valor {
            font-size: 20px;
            font-weight: 800;
            color: var(--green-money);
        }

        .resultado-valor.total {
            font-size: 24px;
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(214, 175, 55, 0.3);
        }

        /* Sección de Casos de Estudio */
        .seccion-completa {
            grid-column: 1 / -1;
        }

        .contenedor-botones-casos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .btn-caso {
            background-color: var(--bg-input);
            border: 1px solid var(--borde-elegante);
            color: var(--text-light);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-caso:hover {
            border-color: var(--gold-primary);
            background-color: #213d30;
            transform: translateY(-2px);
        }

        .btn-caso h4 {
            margin: 0;
            color: var(--gold-primary);
            font-size: 16px;
        }

        .btn-caso p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .bloque-explicacion {
            margin-top: 25px;
            padding: 20px;
            background-color: rgba(214, 175, 55, 0.05);
            border-left: 4px solid var(--gold-primary);
            border-radius: 4px;
            display: none;
        }

        /* Animaciones */
        @keyframes flotar {
